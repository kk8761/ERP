services:
  # NexaERP Enterprise FastAPI Backend
  - type: web
    name: nexaerp-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexaerp-postgres
          property: connectionString
      - key: MONGODB_URI
        sync: false # Add your free MongoDB Atlas URI in Render dashboard (e.g. mongodb+srv://...)
      - key: MONGODB_DB_NAME
        value: nexaerp
      - key: GROQ_API_KEY
        sync: false # Add free Groq API key from groq.com
      - key: GEMINI_API_KEY
        sync: false # Add free Google Gemini API key from aistudio.google.com
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"


  # NexaERP Enterprise React Frontend
  - type: web
    name: nexaerp-frontend
    runtime: static
    plan: free
        rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://nexaerp-backend.onrender.com


databases:
  # Free Managed PostgreSQL Database on Render
  - name: nexaerp-postgres
    plan: free
    region: oregon
    databaseName: nexaerp
    user: nexa_admin

