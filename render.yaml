services:
  # NexaERP Enterprise FastAPI Backend
  - type: web
    name: nexaerp-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexaerp-postgres
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: nexaerp
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://nexaerp-frontend.onrender.com,https://nexaerp-frontend-mlae.onrender.com,http://localhost:5173,http://127.0.0.1:5173"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: NexaERP System
      - key: SMTP_USE_TLS
        value: "true"

  # NexaERP Enterprise React Frontend
  - type: web
    name: nexaerp-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://nexaerp-backend-mlae.onrender.com

databases:
  # Free Managed PostgreSQL Database on Render
  - name: nexaerp-postgres
    plan: free
    region: oregon
