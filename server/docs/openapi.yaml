openapi: 3.0.3
info:
  title: NexaERP API
  description: |
    Enterprise-grade ERP REST API for NexaERP — covering POS billing, inventory management,
    order processing, accounting, CRM, HCM, and analytics.

    ## Authentication
    Most endpoints require a valid session cookie or Bearer token obtained via `POST /api/auth/login`.

    ## Rate Limiting
    - General: 500 requests per 15 minutes
    - Auth endpoints: 30 requests per 15 minutes

    ## Response Envelope
    All responses follow a standard envelope:
    ```json
    { "success": true, "data": { ... }, "message": "..." }
    ```
  version: 2.0.0
  contact:
    name: NexaERP Support
    url: https://nexaerp.netlify.app
  license:
    name: Proprietary

servers:
  - url: https://your-backend-domain.com/api
    description: Production
  - url: http://localhost:5000/api
    description: Local development

tags:
  - name: Authentication
    description: Login, logout, MFA, and SSO
  - name: Inventory
    description: Products, stock management, and barcode scanning
  - name: POS / Orders
    description: Point-of-sale transactions and order management
  - name: Accounting
    description: Journal entries, accounts, and financial statements
  - name: CRM
    description: Customers, leads, and activity logging
  - name: HCM
    description: Employees, departments, and payroll
  - name: Analytics
    description: KPIs, reports, and data exports

# ─── Security ─────────────────────────────────────────────────────────────
security:
  - bearerAuth: []
  - cookieAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid

  # ─── Reusable Schemas ──────────────────────────────────────────────────
  schemas:

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        message:
          type: string
          example: Operation successful

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        errors:
          type: array
          items:
            type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        totalPages:
          type: integer
          example: 8

    User:
      type: object
      properties:
        id:
          type: string
          example: usr_01HX9KZPQR
        email:
          type: string
          format: email
          example: admin@store.com
        name:
          type: string
          example: Store Admin
        role:
          type: string
          enum: [ADMIN, MANAGER, CASHIER, VIEWER]

    Product:
      type: object
      required: [name, sku, price]
      properties:
        id:
          type: string
          example: prod_01HX
        name:
          type: string
          example: Basmati Rice 5kg
        sku:
          type: string
          example: RICE-BSMT-5KG
        category:
          type: string
          example: Grocery
        price:
          type: number
          format: float
          example: 450.00
        purchasePrice:
          type: number
          format: float
          example: 380.00
        stock:
          type: integer
          example: 120
        reorderLevel:
          type: integer
          example: 20
        unit:
          type: string
          example: bag
        barcode:
          type: string
          example: "8901234567890"
        taxRate:
          type: number
          example: 5
        supplier:
          type: string
          example: AgriSupply Co.

    OrderItem:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          format: float
        discount:
          type: number
          default: 0

    Order:
      type: object
      properties:
        id:
          type: string
          example: ord_01HX9K
        orderNumber:
          type: string
          example: POS-2024-0042
        total:
          type: number
          example: 90.00
        tax:
          type: number
          example: 16.20
        grandTotal:
          type: number
          example: 106.20
        status:
          type: string
          enum: [PENDING, COMPLETED, CANCELLED, RETURNED]
        paymentMethod:
          type: string
          enum: [CASH, CARD, UPI, CREDIT]
        createdAt:
          type: string
          format: date-time

    Customer:
      type: object
      required: [name]
      properties:
        id:
          type: string
          example: cust_01HX
        name:
          type: string
          example: Ramesh Kumar
        email:
          type: string
          format: email
        phone:
          type: string
          example: "+91-9876543210"
        address:
          type: string
        loyaltyPoints:
          type: integer
          default: 0
        loyaltyTier:
          type: string
          enum: [BRONZE, SILVER, GOLD, PLATINUM]

    Employee:
      type: object
      required: [firstName, lastName, email, department]
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        department:
          type: string
        designation:
          type: string
        joinDate:
          type: string
          format: date
        salary:
          type: number
        status:
          type: string
          enum: [ACTIVE, INACTIVE, ON_LEAVE]

    JournalEntry:
      type: object
      required: [date, description, lines]
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        description:
          type: string
        reference:
          type: string
        lines:
          type: array
          items:
            type: object
            properties:
              accountId:
                type: string
              debit:
                type: number
              credit:
                type: number

# ─── Paths ─────────────────────────────────────────────────────────────────
paths:

  # ── Auth ──────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@store.com
                password:
                  type: string
                  format: password
                  example: SecurePass123!
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
                          sessionToken:
                            type: string
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: Too many login attempts

  /auth/logout:
    post:
      tags: [Authentication]
      summary: End the current session
      responses:
        "200":
          description: Logged out successfully

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'

  /auth/mfa/setup:
    get:
      tags: [Authentication]
      summary: Get TOTP MFA setup QR code
      responses:
        "200":
          description: MFA setup info with QR code

  /auth/mfa/verify:
    post:
      tags: [Authentication]
      summary: Verify MFA token after login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: MFA verified successfully
        "401":
          description: Invalid MFA token

  # ── Inventory ─────────────────────────────────────────────────────────────

  /inventory:
    get:
      tags: [Inventory]
      summary: List all products
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: search
          in: query
          schema: { type: string }
          description: Search by name or SKU
        - name: category
          in: query
          schema: { type: string }
        - name: lowStock
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
                      pagination:
                        $ref: '#/components/schemas/Pagination'

    post:
      tags: [Inventory]
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /inventory/{id}:
    get:
      tags: [Inventory]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product details
        "404":
          description: Product not found

    put:
      tags: [Inventory]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        "200":
          description: Product updated
        "404":
          description: Product not found

    delete:
      tags: [Inventory]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product deleted
        "404":
          description: Product not found

  /inventory/{id}/stock:
    patch:
      tags: [Inventory]
      summary: Adjust product stock
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adjustment]
              properties:
                adjustment:
                  type: integer
                  description: Positive to add, negative to subtract
                  example: 100
                reason:
                  type: string
                  example: Received from supplier
      responses:
        "200":
          description: Stock updated

  # ── POS / Orders ──────────────────────────────────────────────────────────

  /orders:
    get:
      tags: [POS / Orders]
      summary: List orders
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [SALE, PURCHASE]
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, COMPLETED, CANCELLED]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Paginated order list

    post:
      tags: [POS / Orders]
      summary: Create a POS sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                customerId:
                  type: string
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/OrderItem'
                paymentMethod:
                  type: string
                  enum: [CASH, CARD, UPI, CREDIT]
                  default: CASH
                notes:
                  type: string
      responses:
        "201":
          description: Sale completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'

  /orders/{id}:
    get:
      tags: [POS / Orders]
      summary: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order details

  /orders/{id}/invoice:
    get:
      tags: [POS / Orders]
      summary: Download GST invoice as PDF
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PDF invoice
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /orders/purchase:
    post:
      tags: [POS / Orders]
      summary: Create a purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplierId, items]
              properties:
                supplierId:
                  type: string
                expectedDelivery:
                  type: string
                  format: date
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/OrderItem'
                notes:
                  type: string
      responses:
        "201":
          description: Purchase order created

  /orders/{id}/receive:
    post:
      tags: [POS / Orders]
      summary: Record goods receipt (GRN)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receivedItems]
              properties:
                receivedItems:
                  type: array
                  items:
                    type: object
                    properties:
                      productId: { type: string }
                      receivedQty: { type: integer }
                      batchNo: { type: string }
                receivedAt:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Goods receipt recorded

  # ── Accounting ─────────────────────────────────────────────────────────────

  /accounting/accounts:
    get:
      tags: [Accounting]
      summary: List chart of accounts
      responses:
        "200":
          description: List of GL accounts

  /accounting/journal-entries:
    post:
      tags: [Accounting]
      summary: Create a journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntry'
      responses:
        "201":
          description: Journal entry created
        "400":
          description: Unbalanced entry (debits ≠ credits)

  /accounting/trial-balance:
    get:
      tags: [Accounting]
      summary: Get trial balance for a period
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Trial balance data

  /accounting/profit-loss:
    get:
      tags: [Accounting]
      summary: Get P&L statement
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Profit and loss statement

  # ── CRM ───────────────────────────────────────────────────────────────────

  /crm/customers:
    get:
      tags: [CRM]
      summary: List customers
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: tier
          in: query
          schema:
            type: string
            enum: [BRONZE, SILVER, GOLD, PLATINUM]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Paginated customer list

    post:
      tags: [CRM]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        "201":
          description: Customer created

  /crm/customers/{id}:
    get:
      tags: [CRM]
      summary: Get customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Customer details

    put:
      tags: [CRM]
      summary: Update customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
      responses:
        "200":
          description: Customer updated

  /crm/customers/{id}/orders:
    get:
      tags: [CRM]
      summary: Get customer purchase history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Customer orders list

  /crm/activities:
    post:
      tags: [CRM]
      summary: Log a customer activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, type, subject]
              properties:
                customerId: { type: string }
                type:
                  type: string
                  enum: [CALL, EMAIL, MEETING, NOTE]
                subject: { type: string }
                description: { type: string }
                outcome:
                  type: string
                  enum: [POSITIVE, NEUTRAL, NEGATIVE]
                scheduledAt:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Activity logged

  # ── HCM ───────────────────────────────────────────────────────────────────

  /hcm/employees:
    get:
      tags: [HCM]
      summary: List employees
      parameters:
        - name: department
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, ON_LEAVE]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Employee list

    post:
      tags: [HCM]
      summary: Create an employee record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
      responses:
        "201":
          description: Employee created

  /hcm/employees/{id}:
    get:
      tags: [HCM]
      summary: Get employee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Employee details

  /hcm/payroll/process:
    post:
      tags: [HCM]
      summary: Process payroll for a month
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month, year]
              properties:
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
                year:
                  type: integer
                  example: 2024
                departmentId:
                  type: string
      responses:
        "200":
          description: Payroll processed

  # ── Analytics ─────────────────────────────────────────────────────────────

  /analytics/kpis:
    get:
      tags: [Analytics]
      summary: Get dashboard KPIs
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [DAY, WEEK, MONTH, QUARTER, YEAR]
            default: MONTH
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: KPI data

  /analytics/gst-report:
    get:
      tags: [Analytics]
      summary: Get GST report
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: format
          in: query
          schema:
            type: string
            enum: [json, excel]
            default: json
      responses:
        "200":
          description: GST report data or Excel file

  /analytics/inventory-valuation:
    get:
      tags: [Analytics]
      summary: Get inventory valuation report
      parameters:
        - name: method
          in: query
          schema:
            type: string
            enum: [FIFO, LIFO, WEIGHTED_AVG]
            default: FIFO
      responses:
        "200":
          description: Inventory valuation data

  # ── Docs ──────────────────────────────────────────────────────────────────

  /docs:
    get:
      tags: []
      summary: Developer documentation portal
      security: []
      responses:
        "200":
          description: HTML developer documentation page
          content:
            text/html:
              schema:
                type: string

  /docs/openapi.yaml:
    get:
      tags: []
      summary: OpenAPI specification (YAML)
      security: []
      responses:
        "200":
          description: OpenAPI 3.0 spec
          content:
            application/yaml:
              schema:
                type: string
