<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documentation — NexaERP</title>
  <meta name="description" content="Browse, search, and read NexaERP help articles. Find guides for POS, inventory, accounting, CRM, and more." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/release-notes.css" />

  <!-- Backend API URL -->
  <script>
    window.NEXAERP_API    = 'https://nexaerp-api.onrender.com/api';
    window.NEXAERP_SOCKET = 'https://nexaerp-api.onrender.com';
  </script>

  <style>
    /* ── Page shell ─────────────────────────────────────── */
    *,
    *::before,
    *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--color-bg-primary);
      color: var(--color-text-primary);
      min-height: 100vh;
      line-height: var(--leading-normal);
    }

    /* ── Top navigation ─────────────────────────────────── */
    .docs-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 32px;
      height: 64px;
      background: rgba(10, 11, 15, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--color-border-default);
    }

    .docs-nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .docs-nav-logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--gradient-brand);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .docs-nav-logo-text {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: var(--font-bold);
    }

    .docs-nav-logo-text .nexa { color: var(--color-text-primary); }
    .docs-nav-logo-text .erp {
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .docs-nav-divider {
      width: 1px;
      height: 24px;
      background: var(--color-border-default);
    }

    .docs-nav-title {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--color-text-secondary);
      letter-spacing: 0.02em;
    }

    .docs-nav-spacer { flex: 1; }

    .docs-nav-link {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--color-text-secondary);
      transition: background 0.15s, color 0.15s;
    }

    .docs-nav-link:hover {
      background: var(--color-bg-elevated);
      color: var(--color-text-primary);
    }

    .docs-nav-link.primary {
      background: var(--gradient-brand);
      color: #fff;
    }

    .docs-nav-link.primary:hover { opacity: 0.9; }

    /* ── Hero ────────────────────────────────────────────── */
    .docs-hero {
      padding: 64px 32px 48px;
      text-align: center;
      background: radial-gradient(ellipse 70% 40% at 50% 0%, rgba(99,102,241,0.12) 0%, transparent 70%);
      border-bottom: 1px solid var(--color-border-subtle);
    }

    .docs-hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 100px;
      background: rgba(99,102,241,0.12);
      border: 1px solid rgba(99,102,241,0.25);
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
      color: var(--color-brand-400);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .docs-hero-title {
      font-family: var(--font-display);
      font-size: clamp(var(--text-3xl), 5vw, var(--text-5xl));
      font-weight: var(--font-bold);
      line-height: var(--leading-tight);
      margin-bottom: 16px;
    }

    .docs-hero-title .gradient-text {
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .docs-hero-subtitle {
      font-size: var(--text-lg);
      color: var(--color-text-secondary);
      max-width: 560px;
      margin: 0 auto 32px;
    }

    /* ── Search bar ─────────────────────────────────────── */
    .docs-search-wrap {
      position: relative;
      max-width: 640px;
      margin: 0 auto;
    }

    .docs-search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-tertiary);
      pointer-events: none;
    }

    #docs-search-input {
      width: 100%;
      height: 56px;
      padding: 0 52px 0 52px;
      border-radius: 16px;
      border: 1.5px solid var(--color-border-default);
      background: var(--color-bg-card);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      font-size: var(--text-base);
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    #docs-search-input::placeholder { color: var(--color-text-tertiary); }

    #docs-search-input:focus {
      border-color: var(--color-brand-500);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }

    .docs-search-shortcut {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #docs-search-clear {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-tertiary);
      padding: 4px;
      border-radius: 6px;
      font-size: 16px;
      line-height: 1;
      transition: color 0.15s;
    }

    #docs-search-clear:hover { color: var(--color-text-primary); }

    #docs-search-input:not(:placeholder-shown) ~ .docs-search-shortcut #docs-search-clear {
      display: flex;
    }

    .docs-kbd {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 5px;
      border: 1px solid var(--color-border-default);
      background: var(--color-bg-elevated);
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--color-text-tertiary);
    }

    /* ── Layout ──────────────────────────────────────────── */
    .docs-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 0;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0;
      min-height: calc(100vh - 64px - 220px);
    }

    /* ── Sidebar / Categories ─────────────────────────────── */
    .docs-sidebar {
      position: sticky;
      top: 64px;
      height: calc(100vh - 64px);
      overflow-y: auto;
      padding: 28px 20px;
      border-right: 1px solid var(--color-border-subtle);
      background: var(--color-bg-secondary);
      scrollbar-width: thin;
      scrollbar-color: var(--color-border-default) transparent;
    }

    .docs-sidebar-label {
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
      color: var(--color-text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0 8px;
      margin-bottom: 10px;
    }

    #docs-categories {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .docs-cat-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 12px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--color-text-secondary);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      cursor: pointer;
      text-align: left;
      transition: background 0.12s, color 0.12s;
    }

    .docs-cat-btn:hover {
      background: var(--color-bg-elevated);
      color: var(--color-text-primary);
    }

    .docs-cat-btn.active {
      background: rgba(99,102,241,0.12);
      color: var(--color-brand-400);
      font-weight: var(--font-semibold);
    }

    /* ── Main content ─────────────────────────────────────── */
    .docs-main {
      padding: 32px 40px;
    }

    .docs-main-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    #docs-result-count {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
    }

    #docs-result-count strong { color: var(--color-text-primary); }

    /* ── Article grid ────────────────────────────────────── */
    #docs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    /* ── Article card ────────────────────────────────────── */
    .docs-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
      border-radius: 14px;
      background: var(--color-bg-card);
      border: 1px solid var(--color-border-default);
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    }

    .docs-card:hover {
      border-color: var(--color-brand-500);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25), 0 0 0 1px rgba(99,102,241,0.2);
    }

    .docs-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .docs-card-icon {
      font-size: 20px;
      line-height: 1;
      flex-shrink: 0;
    }

    .docs-card-category {
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
      color: var(--color-brand-400);
      letter-spacing: 0.03em;
    }

    .docs-card-title {
      font-size: var(--text-base);
      font-weight: var(--font-semibold);
      color: var(--color-text-primary);
      line-height: var(--leading-snug);
      flex-grow: 1;
    }

    .docs-card-summary {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      line-height: var(--leading-relaxed);
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .docs-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: auto;
    }

    .docs-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .docs-tag {
      padding: 2px 8px;
      border-radius: 100px;
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border-subtle);
      font-size: 11px;
      color: var(--color-text-secondary);
    }

    .docs-card-meta {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      font-size: 11px;
      color: var(--color-text-tertiary);
      white-space: nowrap;
    }

    /* ── Skeleton loading ─────────────────────────────────── */
    .docs-card-skeleton {
      cursor: default;
      pointer-events: none;
    }

    .skeleton-line {
      height: 14px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--color-bg-elevated) 25%, var(--color-bg-hover) 50%, var(--color-bg-elevated) 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.4s infinite;
    }

    .skeleton-icon  { width: 36px; height: 36px; border-radius: 8px; }
    .skeleton-title { width: 70%; height: 18px; margin-top: 4px; }
    .skeleton-text  { width: 100%; }
    .skeleton-text.short { width: 55%; }

    @keyframes skeleton-shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Empty / error states ─────────────────────────────── */
    .docs-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 64px 32px;
      color: var(--color-text-secondary);
    }

    .docs-empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .docs-empty p { margin-bottom: 20px; font-size: var(--text-base); }

    .btn-docs-retry {
      padding: 10px 24px;
      border-radius: 10px;
      border: 1px solid var(--color-border-default);
      background: var(--color-bg-elevated);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-docs-retry:hover { background: var(--color-bg-hover); }

    /* ── Pagination ──────────────────────────────────────── */
    #docs-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 24px 0;
    }

    .docs-page-btn {
      min-width: 36px;
      height: 36px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--color-border-default);
      background: var(--color-bg-card);
      color: var(--color-text-secondary);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }

    .docs-page-btn:hover:not(:disabled) {
      background: var(--color-bg-elevated);
      color: var(--color-text-primary);
    }

    .docs-page-btn.active {
      background: var(--color-brand-500);
      border-color: var(--color-brand-500);
      color: #fff;
      font-weight: var(--font-semibold);
    }

    .docs-page-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .docs-page-ellipsis {
      width: 24px;
      text-align: center;
      color: var(--color-text-tertiary);
      font-size: var(--text-sm);
    }

    /* ── Article viewer overlay ───────────────────────────── */
    #docs-article-viewer {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    #docs-article-viewer.open {
      opacity: 1;
      pointer-events: all;
    }

    .docs-viewer-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .docs-viewer-panel {
      position: relative;
      z-index: 1;
      width: min(760px, 100vw);
      height: 100vh;
      overflow-y: auto;
      background: var(--color-bg-secondary);
      border-left: 1px solid var(--color-border-default);
      transform: translateX(40px);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      scrollbar-width: thin;
      scrollbar-color: var(--color-border-default) transparent;
    }

    #docs-article-viewer.open .docs-viewer-panel {
      transform: translateX(0);
    }

    .docs-viewer-toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      background: rgba(17, 18, 25, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-border-subtle);
    }

    .docs-viewer-back {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--color-border-default);
      background: transparent;
      color: var(--color-text-secondary);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }

    .docs-viewer-back:hover {
      background: var(--color-bg-elevated);
      color: var(--color-text-primary);
    }

    .docs-viewer-close {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--color-border-default);
      background: transparent;
      color: var(--color-text-tertiary);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, color 0.12s;
    }

    .docs-viewer-close:hover {
      background: var(--color-bg-elevated);
      color: var(--color-text-primary);
    }

    #docs-article-body {
      padding: 40px 40px 60px;
    }

    /* ── Article content styles ─────────────────────────── */
    .docs-article-meta-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .docs-article-date,
    .docs-article-views {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
    }

    .docs-article-title {
      font-family: var(--font-display);
      font-size: clamp(var(--text-2xl), 4vw, var(--text-3xl));
      font-weight: var(--font-bold);
      line-height: var(--leading-tight);
      margin-bottom: 16px;
    }

    .docs-article-summary {
      font-size: var(--text-lg);
      color: var(--color-text-secondary);
      line-height: var(--leading-relaxed);
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--color-border-subtle);
    }

    .docs-article-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 28px;
    }

    .docs-article-content {
      font-size: var(--text-base);
      line-height: var(--leading-relaxed);
      color: var(--color-text-primary);
    }

    .docs-article-content h1 {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      margin: 32px 0 16px;
      color: var(--color-text-primary);
    }

    .docs-article-content h2 {
      font-size: var(--text-xl);
      font-weight: var(--font-semibold);
      margin: 28px 0 12px;
      color: var(--color-text-primary);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--color-border-subtle);
    }

    .docs-article-content h3 {
      font-size: var(--text-lg);
      font-weight: var(--font-semibold);
      margin: 20px 0 10px;
      color: var(--color-text-primary);
    }

    .docs-article-content p {
      margin-bottom: 14px;
    }

    .docs-article-content ul,
    .docs-article-content ol {
      padding-left: 24px;
      margin-bottom: 14px;
    }

    .docs-article-content li {
      margin-bottom: 6px;
    }

    .docs-article-content code {
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border-subtle);
      font-family: var(--font-mono);
      font-size: 0.88em;
      color: var(--color-brand-400);
    }

    .docs-article-content strong {
      font-weight: var(--font-semibold);
      color: var(--color-text-primary);
    }

    .docs-article-content em {
      color: var(--color-text-secondary);
    }

    .docs-article-content table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: var(--text-sm);
    }

    .docs-article-content th {
      text-align: left;
      padding: 10px 14px;
      background: var(--color-bg-elevated);
      border-bottom: 1px solid var(--color-border-default);
      font-weight: var(--font-semibold);
      color: var(--color-text-primary);
    }

    .docs-article-content td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--color-border-subtle);
      color: var(--color-text-secondary);
    }

    .docs-article-content tr:last-child td { border-bottom: none; }
    .docs-article-content tr:hover td { background: var(--color-bg-elevated); }

    .docs-article-content mark {
      background: rgba(99,102,241,0.25);
      color: var(--color-brand-400);
      border-radius: 2px;
      padding: 0 2px;
    }

    /* ── Related articles ─────────────────────────────────── */
    .docs-related {
      margin-top: 40px;
      padding: 24px;
      border-radius: 14px;
      background: var(--color-bg-card);
      border: 1px solid var(--color-border-subtle);
    }

    .docs-related h4 {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }

    .docs-related ul {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .docs-related a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      transition: background 0.12s, color 0.12s;
    }

    .docs-related a:hover {
      background: var(--color-bg-elevated);
      color: var(--color-text-primary);
    }

    /* ── Feedback ─────────────────────────────────────────── */
    .docs-article-feedback {
      margin-top: 48px;
      padding: 28px;
      border-radius: 14px;
      border: 1px solid var(--color-border-default);
      background: var(--color-bg-card);
      text-align: center;
    }

    .docs-article-feedback p {
      font-size: var(--text-base);
      font-weight: var(--font-medium);
      color: var(--color-text-secondary);
      margin-bottom: 16px;
    }

    .docs-feedback-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .docs-feedback-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 10px;
      border: 1.5px solid var(--color-border-default);
      background: transparent;
      color: var(--color-text-secondary);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }

    .docs-feedback-btn:hover:not(:disabled) {
      background: var(--color-bg-elevated);
      color: var(--color-text-primary);
    }

    .docs-feedback-btn.positive:hover:not(:disabled) {
      border-color: var(--color-success-500);
      color: var(--color-success-400);
    }

    .docs-feedback-btn.negative:hover:not(:disabled) {
      border-color: var(--color-danger-500);
      color: var(--color-danger-400);
    }

    .docs-feedback-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .docs-feedback-result {
      margin-top: 16px;
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
    }

    /* ── Spinner ─────────────────────────────────────────── */
    .docs-article-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 32px;
      gap: 16px;
      color: var(--color-text-secondary);
    }

    .docs-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--color-border-default);
      border-top-color: var(--color-brand-500);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .docs-article-error {
      text-align: center;
      padding: 60px 32px;
      color: var(--color-text-secondary);
    }

    .docs-article-error h3 {
      font-size: var(--text-xl);
      font-weight: var(--font-semibold);
      margin-bottom: 8px;
      color: var(--color-text-primary);
    }

    .docs-article-error p { margin-bottom: 24px; }

    .docs-btn-secondary {
      padding: 10px 22px;
      border-radius: 10px;
      border: 1px solid var(--color-border-default);
      background: var(--color-bg-elevated);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      cursor: pointer;
      transition: background 0.12s;
    }

    .docs-btn-secondary:hover { background: var(--color-bg-hover); }

    /* ── Footer ──────────────────────────────────────────── */
    .docs-footer {
      padding: 32px;
      border-top: 1px solid var(--color-border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .docs-footer-text {
      font-size: var(--text-sm);
      color: var(--color-text-tertiary);
    }

    .docs-footer-links {
      display: flex;
      gap: 20px;
    }

    .docs-footer-links a {
      font-size: var(--text-sm);
      color: var(--color-text-tertiary);
      text-decoration: none;
      transition: color 0.12s;
    }

    .docs-footer-links a:hover { color: var(--color-text-secondary); }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 900px) {
      .docs-layout {
        grid-template-columns: 1fr;
      }

      .docs-sidebar {
        position: static;
        height: auto;
        overflow: visible;
        padding: 20px;
        border-right: none;
        border-bottom: 1px solid var(--color-border-subtle);
      }

      #docs-categories {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .docs-cat-btn {

        padding: 7px 12px;
      }

      .docs-main { padding: 24px 20px; }

      .docs-hero { padding: 40px 20px 32px; }

      .docs-nav { padding: 0 16px; }

      .docs-viewer-panel { width: 100vw; }

      #docs-article-body { padding: 24px 20px 48px; }
    }

    @media (max-width: 540px) {
      #docs-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <script>
    // ── Tab switching ──────────────────────────────────────
    (function () {
      var tabs = document.querySelectorAll('.docs-tab');
      var panels = {
        articles: document.getElementById('panel-articles'),
        videos: document.getElementById('panel-videos'),
        'release-notes': document.getElementById('panel-release-notes'),
      };
      var vlMounted = false;
      var rnMounted = false;

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          var target = tab.dataset.tab;

          tabs.forEach(function (t) {
            t.classList.remove('active');
            t.setAttribute('aria-selected', 'false');
          });
          tab.classList.add('active');
          tab.setAttribute('aria-selected', 'true');

          Object.keys(panels).forEach(function (key) {
            if (key === target) {
              panels[key].removeAttribute('hidden');
            } else {
              panels[key].setAttribute('hidden', '');
            }
          });

          // Lazily mount the video library the first time the tab is shown
          if (target === 'videos' && !vlMounted && window.VideoLibrary) {
            VideoLibrary.init('#vl-container');
            vlMounted = true;
          }

          // Lazily mount the release notes the first time the tab is shown
          if (target === 'release-notes' && !rnMounted && window.ReleaseNotes) {
            ReleaseNotes.init('#rn-root');
            rnMounted = true;
          }

          // Restore tab from URL hash
          history.replaceState(null, '', '#' + target);
        });
      });

      // Restore tab from URL hash on page load
      var hash = location.hash.replace('#', '');
      if (hash && panels[hash]) {
        document.getElementById('tab-' + hash) && document.getElementById('tab-' + hash).click();
      }
    }());
  </script>
