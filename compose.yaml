services:
  # Primary Relational DBMS: PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: nexaerp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexaerp_db}
      POSTGRES_USER: ${POSTGRES_USER:-nexa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nexa_user} -d $${POSTGRES_DB:-nexaerp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - nexaerp_net

  # Polyglot Document Store: MongoDB 7
  mongodb:
    image: mongo:7.0
    container_name: nexaerp_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-nexaerp}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-nexa_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER:-nexa_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./docker/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - nexaerp_net

  # Enterprise FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexaerp_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-nexa_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexaerp_db}
      - MONGODB_URI=mongodb://${MONGO_APP_USER:?Set MONGO_APP_USER}:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}@mongodb:27017/${MONGODB_DB_NAME:-nexaerp}?authSource=${MONGODB_DB_NAME:-nexaerp}
      - MONGODB_DB_NAME=nexaerp
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD}
      - MCP_API_KEY=${MCP_API_KEY:-}
      - COOKIE_SECURE=true
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:80,http://127.0.0.1:5173}
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - nexaerp_net

  # Production React SPA Frontend (Served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    container_name: nexaerp_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - nexaerp_net

volumes:
  postgres_data:
  mongo_data:

networks:
  nexaerp_net:
    driver: bridge
